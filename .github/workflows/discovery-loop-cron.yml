name: Discovery Loop Cron

# Phase 3 (2026-05-20): writes task directly to Cloudflare KV via Worker /api/enqueue-task.
# Replaces the previous pattern of writing to state/inbox/ via git (broken under Phase 3
# transport — daemon no longer polls git inbox).
#
# Fires at 7am + 7pm CDT every day via cron schedule + manual workflow_dispatch.

on:
  schedule:
    - cron: '0 12,0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fire-discovery-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Fire discovery loop via Worker KV enqueue
        env:
          DAEMON_SHARED_SECRET: ${{ secrets.DAEMON_SHARED_SECRET }}
          WORKER_URL: https://jarvis-listener.leograu.workers.dev
        run: |
          set -euo pipefail
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 12 ]; then SLOT=PM; else SLOT=AM; fi
          TODAY_UTC=$(date -u +"%Y-%m-%d")
          ULID="CRON-${SLOT}-$(date -u +%s)"
          CHANNEL="D0B4N3MEWJE"

          BODY=$(cat <<INNER_EOF
          SCHEDULED DISCOVERY LOOP RUN — fired by GitHub Actions cron (Phase 3 KV transport).

          Slot: ${SLOT}. Today: ${TODAY_UTC}.

          YOUR TASK: Read \`/Users/leograu/Desktop/jarvis-feed/AGENT_RUNBOOK.md\` in full and execute it as a complete ${SLOT} Discovery Loop run. Every step including Step 0.5 sendoff and Step 8.5 closer.

          Running on Leo's Mac with full network access — no CCR sandbox limits. Use Haiku-tier subagents for fixer work. Budget ~5% weekly Max plan. cd ~/Desktop/jarvis-feed before git ops. Commit as Mr-Fool-00.

          Return one-line summary when done; closer notify fires automatically.
          INNER_EOF
          )

          PAYLOAD=$(jq -n \
            --arg ulid "$ULID" \
            --arg slack_channel "$CHANNEL" \
            --arg slack_user "gh-actions-cron" \
            --arg body "$BODY" \
            --arg kind "discovery-loop-cron" \
            '{ulid: $ulid, slack_channel: $slack_channel, slack_user: $slack_user, body: $body, kind: $kind}')

          curl -sS -X POST \
            -H "X-Daemon-Secret: ${DAEMON_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: gh-actions-discovery-cron/1.0" \
            -d "$PAYLOAD" \
            "${WORKER_URL}/api/enqueue-task" \
            -o /tmp/enqueue-response.json -w "HTTP %{http_code}\n"

          cat /tmp/enqueue-response.json
          echo

          echo "## Discovery Loop ${SLOT} fired" >> "$GITHUB_STEP_SUMMARY"
          echo "Task ${ULID} written to Cloudflare KV via Worker /api/enqueue-task. Mac daemon polls every 5s." >> "$GITHUB_STEP_SUMMARY"
