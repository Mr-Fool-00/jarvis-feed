# Sources for the Jarvis Discovery Loop.
# All sources must be fetchable via free public API (no auth required).
# Edit freely — agent re-reads every run.

reddit:
  # Public Reddit JSON: https://www.reddit.com/r/SUB/new.json?limit=N
  # User-Agent header required.
  # NOTE 2026-05-19: direct JSON API blocked from CCR sandbox. Use broader WebSearch
  # queries instead (per Suggestion 3 approved). Keep subreddit list for query construction.
  subreddits:
    - ClaudeAI
    - LocalLLaMA
    - AI_Agents
    - PromptEngineering
    - OpenAI
    - MachineLearning
    - LangChain
    - singularity      # high noise, keep low priority
  fetch_limit: 30      # items per sub
  min_score: 5         # drop posts with fewer upvotes
  hours_window: 24     # only consider posts within last N hours
  fallback_strategy: "websearch-broader"  # use broader WebSearch queries like "r/ClaudeAI top posts this week" instead of site:reddit.com narrow

hackernews:
  # Algolia API: https://hn.algolia.com/api/v1/search
  # NOTE 2026-05-19: try WebFetch on hn.algolia.com/api/v1/items/{id} for deep-reading
  # comment threads when WebSearch surfaces a high-value story (per Suggestion 6 approved).
  queries:
    - "Claude"
    - "Anthropic"
    - "Claude Code"
    - "Claude skill"
    - "MCP server"
    - "AI agent"
    - "LLM agent"
    - "agent framework"
  hours_window: 24
  min_points: 10       # drop low-engagement HN stories
  deep_read_via_algolia: true  # for top-scored HN items, WebFetch hn.algolia.com/api/v1/items/{id} for comments

github:
  # API: https://api.github.com/search/repositories
  # Recent repos matching keywords or topics, sorted by stars
  topics:
    - claude-code
    - mcp-server
    - claude-skills
    - claude-plugin
    - anthropic
    - agent-framework
  keywords:
    - "claude code"
    - "anthropic agent"
    - "mcp server"
    - "claude skill"
  pushed_within_days: 3
  min_stars: 10        # filter noise repos

rss:
  feeds:
    - name: "Simon Willison"
      url: "https://simonwillison.net/atom.xml"
    - name: "Anthropic News"
      url: "https://www.anthropic.com/news/rss"
    - name: "Latent Space"
      url: "https://www.latent.space/feed"
    # Added 2026-05-19 per Suggestions 1 + 4 approved
    - name: "Lenny's Newsletter"
      url: "https://www.lennysnewsletter.com/feed"
    - name: "Pragmatic Engineer"
      url: "https://newsletter.pragmaticengineer.com/feed"

# Added 2026-05-19 per Suggestion 2 approved — arxiv papers (cs.AI + cs.CL)
arxiv:
  # No direct API in CCR sandbox; use WebSearch with site:arxiv.org filter
  # Weekly scan for practitioner-relevant papers (not pure theory).
  categories: ["cs.CL", "cs.AI", "cs.LG"]
  keywords: ["agent", "prompt engineering", "tool use", "LLM evaluation", "in-context learning", "multi-agent"]
  hours_window: 168     # 7 days — papers publish less frequently than blog posts
  search_strategy: "websearch"  # WebSearch \"site:arxiv.org 2026 <keyword>\"

# Added 2026-05-19 per Suggestion 5 approved — PulseMCP as MCP-discovery source
pulsemcp:
  # MCP server registry — curated index of new MCP releases. Acts like ProductHunt for MCP.
  url: "https://www.pulsemcp.com/servers"
  search_strategy: "webfetch"   # WebFetch the /servers page, parse for new entries by published date
  hours_window: 168     # weekly scan

youtube:
  # Channel RSS (free, no API key): https://www.youtube.com/feeds/videos.xml?channel_id=ID
  # Listed by handle — agent resolves to channel_id on first sight by fetching the
  # channel page and grepping for `<meta itemprop="channelId" content="...">`.
  # Channel IDs cached in state/youtube_channel_ids.json so resolution is one-time per handle.
  channels:
    - handle: "@aiexplained-official"   # AI Explained — papers, model releases
    - handle: "@mreflow"                # Matt Wolfe — AI tools roundups
    - handle: "@WesRothMoney"           # Wes Roth — AI news commentary
    - handle: "@AIJasonZ"               # AI Jason — builds AI agents/projects
    - handle: "@indydevdan"              # Indy Dev Dan — Claude/Cursor indie builds
    - handle: "@ColeMedin"               # Cole Medin — agent dev tutorials
    - handle: "@DavidOndrej"             # David Ondrej — AI agents, automation
    - handle: "@aifoundations"           # AI Foundations — practical AI tools
    - handle: "@AnthropicAI"             # Official Anthropic
  hours_window: 36       # YouTube posts less frequently than Reddit, longer window
  min_views: 1000        # filter low-engagement videos

incoming_urls:
  # Manual IG-curation funnel. When Leo scrolls Instagram and sees a Reel worth
  # surfacing in Jarvis, he drops the URL into `state/incoming_urls.md` (one per line).
  # The agent reads that file each run, downloads each Reel via yt-dlp, extracts the
  # actual content (frames + transcript), and FORCE-INCLUDES every one in the digest
  # (no score filter — Leo already pre-filtered by curating them).
  # After processing, the agent clears the file (commits empty state).
  # Lets Leo use IG's algorithm + his own taste as the front-end without giving
  # the agent any Instagram credentials or scraping responsibility.
  path: "state/incoming_urls.md"
  force_include: true    # always surface every URL in the digest's top section
  clear_after_run: true  # empty the file after successful processing

