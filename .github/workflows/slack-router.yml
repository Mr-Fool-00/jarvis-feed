name: Slack Router

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Opt into Node.js 24 now — Node 20 is deprecated June 2 2026.
  # Removes the deprecation warning + future-proofs the workflow.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Route commits to Slack channels by prefix
        env:
          SLACK_AI_NEWS: ${{ secrets.SLACK_AI_NEWS }}
          SLACK_ERRORS: ${{ secrets.SLACK_ERRORS }}
          SLACK_IMPROVEMENTS: ${{ secrets.SLACK_IMPROVEMENTS }}
          SLACK_WINS: ${{ secrets.SLACK_WINS }}
          REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Enumerate commits via git (safer than github.event.commits.*.id which is
          # untrusted input; git log from before..after gives us the same list via
          # a trusted local source).
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch — just show HEAD
            COMMIT_RANGE="$AFTER_SHA -1"
          else
            COMMIT_RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          # Get SHAs only (no message data interpolation — read messages with git log per-sha below)
          mapfile -t SHAS < <(git rev-list --reverse "$COMMIT_RANGE" 2>/dev/null || git rev-list -1 "$AFTER_SHA")

          for sha in "${SHAS[@]}"; do
            # Read trusted fields from git, not from github.event
            MSG=$(git log -1 --pretty=%s "$sha")
            AUTHOR=$(git log -1 --pretty=%an "$sha")
            FILES=$(git diff-tree --no-commit-id --name-only -r "$sha" | tr '\n' ' ')
            SHORT_SHA="${sha:0:7}"
            COMMIT_URL="https://github.com/${REPO}/commit/${sha}"

            echo "Processing commit $SHORT_SHA: $MSG"

            # Determine destination channel based on prefix
            WEBHOOK=""
            HEADER=""

            case "$MSG" in
              notify:*)
                # Cheery one-liners (sendoff, heartbeat, "I'm thinking", etc.)
                # Uses simpler payload — no header/SHA/files/button — just the message body.
                WEBHOOK="$SLACK_AI_NEWS"
                HEADER=""
                IS_NOTIFY=1
                ;;
              digest:*)
                WEBHOOK="$SLACK_AI_NEWS"
                HEADER="📰 New digest"
                ;;
              briefing:*)
                WEBHOOK="$SLACK_AI_NEWS"
                HEADER="🛠️ New briefing — react in this channel to confirm/reject"
                ;;
              feat:*|fix:*|chore:*|intel:*|refactor:*|test:*|docs:*)
                WEBHOOK="$SLACK_IMPROVEMENTS"
                HEADER="🔧 Improvement landed"
                ;;
              wins:*)
                WEBHOOK="$SLACK_WINS"
                HEADER="🏆 Win logged"
                ;;
              state:*)
                # Fire #errors when failures.log changed AND new entries aren't all "expected" fallbacks.
                # CCR sandbox can't reach hooks.slack.com directly — the GitHub→Slack bridge is the
                # canonical path, so "Slack 403 expected, bridge active" entries are documented
                # fallbacks not real failures. Skip the #errors fire when every new line is one of
                # those known-benign cases. Real failures still fire as before.
                if echo "$FILES" | grep -q "state/failures.log"; then
                  # Extract only the lines this commit ADDED to failures.log
                  NEW_LINES=$(git show "$sha" -- state/failures.log 2>/dev/null                     | awk '/^@@/{f=1; next} f && /^\+/ && !/^\+\+\+/ {sub(/^\+/,""); print}')
                  # If there are new lines and ANY of them is NOT a known-expected fallback, fire #errors.
                  # If all new lines match expected patterns OR there are no new lines, stay silent.
                  if [ -n "$NEW_LINES" ]; then
                    UNEXPECTED=$(echo "$NEW_LINES" | grep -v -i -E "expected|bridge active|covered via WebSearch|covered via search" || true)
                    if [ -n "$UNEXPECTED" ]; then
                      WEBHOOK="$SLACK_ERRORS"
                      HEADER="🚨 Failures logged"
                    else
                      echo "All new failures.log entries are expected/covered fallbacks — skipping #errors fire"
                    fi
                  fi
                fi
                ;;
              *)
                WEBHOOK="$SLACK_IMPROVEMENTS"
                HEADER="🔧 Improvement landed"
                ;;
            esac

            # Trim whitespace/newlines from the secret value (GitHub doesn't always strip)
            WEBHOOK=$(echo -n "$WEBHOOK" | tr -d '[:space:]')

            if [ -z "$WEBHOOK" ]; then
              echo "  → silent (no channel for this commit type, or secret missing/empty)"
              continue
            fi

            # Sanity check the URL format — catches typos and partial pastes
            if [[ ! "$WEBHOOK" =~ ^https://hooks\.slack\.com/services/ ]]; then
              echo "  ⚠ Webhook URL malformed (not a Slack hooks URL): ${WEBHOOK:0:30}..."
              echo "  → skipping this post, continuing with other commits"
              continue
            fi

            # Build payload via jq for safe JSON escaping (no shell interpolation
            # of message content into the payload directly).
            # notify: prefix → simpler payload (just the message body, no metadata).
            # Everything else → full Block Kit with header + commit context + GitHub button.
            if [ "${IS_NOTIFY:-0}" = "1" ]; then
              # Strip "notify:" prefix + leading whitespace for clean display
              BODY=$(echo "$MSG" | sed 's/^notify:[[:space:]]*//')
              PAYLOAD=$(jq -n --arg text "$BODY" '{text: $text}')
              IS_NOTIFY=0  # reset for next iteration
            else
              # For briefing:/digest: commits with file excerpt, include the substance as
              # a second section block so Slack readers see "what + why" without clicking through.
              if [ -n "${FILE_BODY_EXCERPT:-}" ]; then
                PAYLOAD=$(jq -n \
                  --arg header "$HEADER" \
                  --arg msg "$MSG" \
                  --arg excerpt "$FILE_BODY_EXCERPT" \
                  --arg sha "$SHORT_SHA" \
                  --arg author "$AUTHOR" \
                  --arg files "$FILES" \
                  --arg url "$COMMIT_URL" \
                  '{
                    blocks: [
                      {type: "header", text: {type: "plain_text", text: $header}},
                      {type: "section", text: {type: "mrkdwn", text: ("*" + $msg + "*")}},
                      {type: "divider"},
                      {type: "section", text: {type: "mrkdwn", text: $excerpt}},
                      {type: "context", elements: [
                        {type: "mrkdwn", text: ("`" + $sha + "` by " + $author + " · " + ($files | gsub("^\\s+|\\s+$"; "")))}
                      ]},
                      {type: "actions", elements: [
                        {type: "button", text: {type: "plain_text", text: "View on GitHub"}, url: $url}
                      ]}
                    ]
                  }')
              else
                PAYLOAD=$(jq -n \
                  --arg header "$HEADER" \
                  --arg msg "$MSG" \
                  --arg sha "$SHORT_SHA" \
                  --arg author "$AUTHOR" \
                  --arg files "$FILES" \
                  --arg url "$COMMIT_URL" \
                  '{
                    blocks: [
                      {type: "header", text: {type: "plain_text", text: $header}},
                      {type: "section", text: {type: "mrkdwn", text: ("*" + $msg + "*")}},
                      {type: "context", elements: [
                        {type: "mrkdwn", text: ("`" + $sha + "` by " + $author + " · files: " + ($files | gsub("^\\s+|\\s+$"; "")))}
                      ]},
                      {type: "actions", elements: [
                        {type: "button", text: {type: "plain_text", text: "View on GitHub"}, url: $url}
                      ]}
                    ]
                  }')
              fi
            fi

            # Sub-second outbox delivery: if this commit touched state/outbox/, poke the Worker
            # to process the outbox immediately rather than waiting up to 60s for the next cron.
            # Unauthenticated endpoint; failure is silently tolerated (cron is the safety net).
            if echo "$FILES" | grep -q "state/outbox/"; then
              echo "  → Poking Worker outbox-poll for sub-second delivery"
              curl -s -X POST https://jarvis-listener.leograu.workers.dev/poll-outbox >/dev/null 2>&1 || true
            fi

            # Enrich briefing: + digest: posts with the actual file content so Slack readers
            # see the substance ("what + why"), not just the commit-message title.
            # Heuristic: for briefing:/digest: prefix, find the first .md file in briefings/
            # or digests/ that this commit touched, read its first ~1200 chars, and include
            # them as a section block in the Slack post. Bumped from 600 to 1200 because 600
            # cut off mid-sentence on most briefings.
            FILE_BODY_EXCERPT=""
            if [[ "$MSG" == briefing:* ]] || [[ "$MSG" == digest:* ]]; then
              TARGET_FILE=$(echo "$FILES" | tr ' ' '\n' | grep -E '^(briefings|digests)/.*\.md$' | head -1)
              if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
                # Read full file into a bash var, then truncate via substring. Avoids `head -c | cmd`
                # SIGPIPE (exit 141 under pipefail) which fired on the digest file (large file →
                # head closes pipe early → awk gets SIGPIPE → pipefail kills script).
                FULL_BODY=""
                FULL_BODY=$(awk '/^---$/{n++;next} n==2{print}' "$TARGET_FILE" 2>/dev/null || true)
                if [ -z "$FULL_BODY" ]; then
                  FULL_BODY=$(tail -n +2 "$TARGET_FILE" 2>/dev/null || true)
                fi
                if [ -z "$FULL_BODY" ]; then
                  FULL_BODY=$(cat "$TARGET_FILE" 2>/dev/null || true)
                fi
                FILE_BODY_EXCERPT="${FULL_BODY:0:1200}"
                if [ ${#FULL_BODY} -gt 1200 ]; then
                  FILE_BODY_EXCERPT="${FILE_BODY_EXCERPT}..."
                fi
              fi
            fi

            echo "  → POST to $HEADER"
            # Capture curl exit code separately so a curl-level error (network, malformed URL,
            # etc.) doesn't abort the whole job via set -e. Loop continues regardless.
            set +e
            HTTP_CODE=$(curl -s -o /tmp/slack_resp -w "%{http_code}" \
              -X POST -H 'Content-Type: application/json' \
              --data "$PAYLOAD" \
              "$WEBHOOK")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" != "0" ]; then
              echo "    ✗ curl exit code $CURL_EXIT (webhook unreachable, malformed URL, or network issue)"
            elif [ "$HTTP_CODE" = "200" ]; then
              echo "    ✓ 200 OK"
            else
              RESP=$(cat /tmp/slack_resp 2>/dev/null || echo "(empty)")
              echo "    ✗ HTTP $HTTP_CODE: $RESP"
            fi
          done
