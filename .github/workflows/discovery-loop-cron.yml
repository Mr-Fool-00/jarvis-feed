name: Discovery Loop Cron

# Replaces the dead Anthropic CCR trigger (silent-failing as of 2026-05-19).
# Fires at 7am + 7pm CDT every day via cron schedule + manual workflow_dispatch.

on:
  schedule:
    - cron: '0 12,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fire-discovery-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fire discovery loop
        run: |
          set -euo pipefail
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 12 ]; then SLOT=PM; else SLOT=AM; fi
          ULID="CRON-${SLOT}-$(date -u +%s)"
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TODAY_UTC=$(date -u +"%Y-%m-%d")
          CHANNEL="D0B4N3MEWJE"

          mkdir -p state/inbox
          cat > "state/inbox/${ULID}.md" <<EOF
          ---
          ulid: ${ULID}
          slack_channel: ${CHANNEL}
          slack_user: gh-actions-cron
          slack_thread_ts:
          created_at: ${NOW_UTC}
          status: pending
          history_messages: 0
          ---

          SCHEDULED DISCOVERY LOOP RUN — fired by GitHub Actions cron, replaces the dead Anthropic CCR trigger.

          Slot: ${SLOT}. Today: ${TODAY_UTC}.

          YOUR TASK: Read \`/Users/leograu/Desktop/jarvis-feed/AGENT_RUNBOOK.md\` in full and execute it as a complete ${SLOT} Discovery Loop run. Every step including Step 0.5 sendoff and Step 8.5 closer.

          Running on Leo's Mac with full network access — no CCR sandbox limits. Use Haiku-tier subagents for fixer work. Budget ~5% weekly Max plan. cd ~/Desktop/jarvis-feed before git ops. Commit as Mr-Fool-00.

          Return one-line summary when done; closer notify fires automatically.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "state/inbox/${ULID}.md"
          git commit -m "inbox: scheduled ${SLOT} discovery-loop fire (gh-actions cron)"
          git push origin main

          echo "## Discovery Loop ${SLOT} fired" >> $GITHUB_STEP_SUMMARY
          echo "Inbox file committed. Mac daemon picks up within 30s when laptop is on." >> $GITHUB_STEP_SUMMARY
